- pipeline: meechain-repo-verify
  name: MEECHAIN-REPO-VERIFY
  refs:
  - refs/heads/main
  execution_message_template: MEECHAIN-REPO-VERIFY
  always_from_scratch: true
  ignore_fail_on_project_status: true
  skip_queued_runs: SAME_ENVIRONMENT
  cancel_inprogress_runs: SAME_ENVIRONMENT
  auto_clear_cache: true
  clone_depth: 2
  do_not_create_commit_status: true
  resources: NANO
  description_required: true
  environments:
  - environment: ENV-BASE-002
    tags:
    - Governance
  events:
  - type: WEBHOOK
  - type: ENVIRONMENT_CREATE
    environments:
    - '*'
  docker_build_cache: PROJECT
  actions:
  - action: Verify pipeline context
    type: BUILD
    commands: |-
      echo "MEECHAIN-REPO-VERIFY: pipeline started"
      echo "Repository ref: $BUDDY_RUN_REF"
      echo "This initial run validates the Buddy pipeline context only."
    shell: BASH
    docker_image_name: library/ubuntu
    docker_image_tag: "24.04"
  - action: "    auto_approve: false"
    type: VM_LINUX
    commands: |-
      visual_tests:
        suite: "My First Suite"

        capture:
          color_scheme: light

          resolutions:
            - name: HD
              width: 1280
              height: 720
              priority: 1

            - name: Full-HD
              width: 1920
              height: 1080
              priority: 1

            - name: Laptop
              width: 1536
              height: 864
              priority: 1

            - name: HD-Laptop
              width: 1600
              height: 900
              priority: 1

            - name: QHD
              width: 2560
              height: 1440
              priority: 2

            - name: UHD-4K
              width: 3840
              height: 2160
              priority: 2

            - name: iPad-Mini
              width: 768
              height: 1024
              priority: 2

        comparison:
          baseline_branch: main
          auto_approve_branches: []
          threshold: 0.1
          views_grouping_separator: "/"

        rendering:
          timeout: 60
          skip_larger_resolutions: false
          post_capture_js: false

        governance:
          require_owner_approval: true
          auto_approve: false
    instance_type: GENERAL_MEDIUM
    mount_paths:
    - pipeline_path: /
      vm_path: /buddy
